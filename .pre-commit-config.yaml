repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.3
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: conda-requirements
        name: conda-requirements
        entry: python conda/requirements.py
        language: python
        files: ^(requirements\.txt|pyproject\.toml)$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
    -   id: mypy
        args: []
        language: system
        files: ^quixstreams/
        # Generated Protobuf modules have no static symbols; mypy is told to
        # treat them as Any via [[tool.mypy.overrides]] in pyproject.toml,
        # which only applies to imported (not command-line) files.
        exclude: _pb2\.py$
